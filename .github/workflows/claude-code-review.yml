# Claude Code Review — Automated PR Review
#
# SETUP REQUIRED: Add ANTHROPIC_API_KEY to this repo's secrets
# GitHub → Settings → Secrets and variables → Actions → New repository secret
#
# Triggers on PRs to main/master. Posts findings as review comments.
# Sets review to REQUEST_CHANGES if any finding scores ≥90, otherwise COMMENT.

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  # ── Phase 1: Triage ── Cheap Haiku check; skip noise before running full review
  triage:
    name: PR Triage
    runs-on: ubuntu-latest
    outputs:
      should_review: ${{ steps.check.outputs.should_review }}
      skip_reason: ${{ steps.check.outputs.skip_reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if review should run
        id: check
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Skip draft PRs
          if [ "$PR_DRAFT" = "true" ]; then
            echo "should_review=false" >> $GITHUB_OUTPUT
            echo "skip_reason=Draft PR — skipping review" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Skip known bots
          BOT_LOGINS="dependabot[bot] renovate[bot] github-actions[bot]"
          for bot in $BOT_LOGINS; do
            if [ "$PR_AUTHOR" = "$bot" ]; then
              echo "should_review=false" >> $GITHUB_OUTPUT
              echo "skip_reason=Bot PR ($PR_AUTHOR) — skipping review" >> $GITHUB_OUTPUT
              exit 0
            fi
          done

          # Skip if labeled skip-ai-review (unless force-ai-review is also set)
          if echo "$PR_LABELS" | grep -q "skip-ai-review" && ! echo "$PR_LABELS" | grep -q "force-ai-review"; then
            echo "should_review=false" >> $GITHUB_OUTPUT
            echo "skip_reason=skip-ai-review label set" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get diff stats
          LINES_CHANGED=$(git diff --shortstat origin/${{ github.base_ref }}...HEAD | grep -oP '\d+(?= insertion)' || echo "0")
          LINES_CHANGED=$((LINES_CHANGED + $(git diff --shortstat origin/${{ github.base_ref }}...HEAD | grep -oP '\d+(?= deletion)' || echo "0")))

          # Skip very small PRs (< 5 lines) unless force-ai-review label
          MIN_LINES=${MIN_REVIEW_LINES:-5}
          if [ "$LINES_CHANGED" -lt "$MIN_LINES" ] && ! echo "$PR_LABELS" | grep -q "force-ai-review"; then
            echo "should_review=false" >> $GITHUB_OUTPUT
            echo "skip_reason=PR too small ($LINES_CHANGED lines) — skipping review" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Skip docs/CI-only PRs
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          NON_DOCS=$(echo "$CHANGED_FILES" | grep -vE '(\.md$|\.txt$|^docs/|^CHANGELOG|\.github/workflows/)' || true)
          if [ -z "$NON_DOCS" ] && ! echo "$PR_LABELS" | grep -q "force-ai-review"; then
            echo "should_review=false" >> $GITHUB_OUTPUT
            echo "skip_reason=Docs/CI only changes — skipping review" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "should_review=true" >> $GITHUB_OUTPUT

  # ── Phase 2: Build & Test ── Verify baseline before review
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: triage
    if: needs.triage.outputs.should_review == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Tests
        run: npm run test

  # ── Phase 3: AI Review ── Multi-agent review using Claude Code
  ai-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    needs: [triage, build-and-test]
    if: needs.triage.outputs.should_review == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-sonnet-4-6
          timeout_minutes: 15
          prompt: |
            You are reviewing a pull request for the Clyde Chrome extension — a MV3 extension that watches Slack, extracts commitments via Claude, and stores them locally in IndexedDB.

            The PR is: ${{ github.event.pull_request.title }}
            Branch: ${{ github.head_ref }} → ${{ github.base_ref }}
            Author: ${{ github.event.pull_request.user.login }}

            Run the full multi-agent review as defined in .claude/commands/review.md.

            REVIEW_THRESHOLD=80

            After completing the review, output your findings in this exact format for each issue:

            ---FINDING---
            FILE: <relative/path/to/file.ts>
            LINE: <line number or range, e.g. 42 or 42-55>
            CATEGORY: <bug|security|compliance|test>
            CONFIDENCE: <0-100>
            TITLE: <one-line summary>
            BODY: <detailed explanation, 2-5 sentences, include suggested fix>
            ---END---

            After all findings, output:
            ---SUMMARY---
            BLOCKING: <true if any finding ≥ 90, false otherwise>
            FINDING_COUNT: <total findings above threshold>
            RECOMMENDATION: <APPROVE|REQUEST_CHANGES|COMMENT>
            ---END---

            If no findings above threshold, output only:
            ---SUMMARY---
            BLOCKING: false
            FINDING_COUNT: 0
            RECOMMENDATION: APPROVE
            ---END---

      - name: Post review comments
        uses: actions/github-script@v7
        if: always()
        env:
          REVIEW_OUTPUT: ${{ steps.run-claude-code-review.outputs.result }}
        with:
          script: |
            const output = process.env.REVIEW_OUTPUT || '';

            // Parse findings
            const findingRegex = /---FINDING---([\s\S]*?)---END---/g;
            const summaryRegex = /---SUMMARY---([\s\S]*?)---END---/;

            const findings = [];
            let match;
            while ((match = findingRegex.exec(output)) !== null) {
              const block = match[1];
              const get = (key) => {
                const m = block.match(new RegExp(`${key}: (.+)`));
                return m ? m[1].trim() : '';
              };
              const conf = parseInt(get('CONFIDENCE'), 10);
              const threshold = parseInt(process.env.REVIEW_THRESHOLD || '80', 10);
              if (conf >= threshold) {
                findings.push({
                  file: get('FILE'),
                  line: parseInt(get('LINE').split('-')[0], 10) || 1,
                  category: get('CATEGORY'),
                  confidence: conf,
                  title: get('TITLE'),
                  body: get('BODY'),
                });
              }
            }

            const summaryMatch = summaryRegex.exec(output);
            const getSum = (key) => {
              if (!summaryMatch) return '';
              const m = summaryMatch[1].match(new RegExp(`${key}: (.+)`));
              return m ? m[1].trim() : '';
            };
            const blocking = getSum('BLOCKING') === 'true';
            const recommendation = getSum('RECOMMENDATION') || 'COMMENT';

            const categoryEmoji = { bug: '🐛', security: '🔒', compliance: '📋', test: '🧪' };

            // Post inline comments for each finding
            const comments = findings.map(f => ({
              path: f.file,
              line: f.line,
              body: `${categoryEmoji[f.category] || '⚠️'} **[${f.category.toUpperCase()}]** ${f.title}\n\n${f.body}\n\n_Confidence: ${f.confidence}/100_`,
            }));

            // Build summary body
            let summaryBody = findings.length === 0
              ? '✅ **Claude Code Review**: No issues found above confidence threshold. Build and tests passed.'
              : `## Claude Code Review\n\n**${findings.length} finding(s)** above confidence threshold.\n\n` +
                findings.map(f =>
                  `- ${categoryEmoji[f.category] || '⚠️'} **${f.title}** (\`${f.file}\`) — confidence ${f.confidence}`
                ).join('\n');

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              commit_id: context.payload.pull_request.head.sha,
              body: summaryBody,
              event: blocking ? 'REQUEST_CHANGES' : (findings.length > 0 ? 'COMMENT' : 'APPROVE'),
              comments: comments.filter(c => c.path && c.line),
            });

  # ── Skip notification ──
  skip-notification:
    name: Skipped
    runs-on: ubuntu-latest
    needs: triage
    if: needs.triage.outputs.should_review == 'false'
    steps:
      - name: Log skip reason
        run: echo "Review skipped — ${{ needs.triage.outputs.skip_reason }}"
